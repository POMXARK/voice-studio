<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceStudio</title>
<style>
:root{--bg:#14161a;--pn:#1d2026;--pn2:#262a32;--tx:#e6e8ec;--mu:#8b93a1;--ac:#5aa2ff;--ok:#4cc38a;--bad:#ef6a6a;--warn:#e8b04a;--bd:#323743}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,sans-serif;display:grid;grid-template-rows:auto auto 1fr 240px;height:100vh}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}button,select,input,textarea{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#06101f;border-color:var(--ac);font-weight:600}button.sm{padding:2px 7px;font-size:12px}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}#list{overflow:auto;padding:8px 12px}#side{border-left:1px solid var(--bd);background:var(--pn);overflow:auto;padding:12px}
.row{display:grid;grid-template-columns:22px 1fr 150px;gap:8px;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;background:var(--pn);cursor:pointer}.row.sel{border-color:var(--ac)}.row.cur{background:var(--pn2)}
.nm{color:var(--mu);font-size:11px;word-break:break-all}.tx{font-size:14px}.src{color:var(--mu);font-size:12px}.b{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;margin-right:4px}
.b.ok{background:#1d3b2e;color:var(--ok)}.b.bad{background:#40222a;color:var(--bad)}.b.dub{background:#3d3420;color:var(--warn)}.b.no{background:var(--pn2);color:var(--mu)}.b.in{background:#1f3350;color:var(--ac)}
h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--mu);letter-spacing:.05em}label{display:block;color:var(--mu);font-size:12px;margin:8px 0 2px}side input,#side select,#side textarea{width:100%}
textarea{resize:vertical;min-height:60px}.take{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:5px 0;font-size:12px}.take.ch{border-color:var(--ok)}.flex{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#con{background:#0d0f12;border-top:1px solid var(--bd);display:grid;grid-template-columns:330px 1fr;min-height:0}#jobs{overflow:auto;padding:6px;border-right:1px solid var(--bd)}#log{margin:0;padding:8px;overflow:auto;font:12px/1.35 Consolas,monospace;color:#b9f0d0;white-space:pre-wrap}
.bar{height:6px;background:var(--pn2);border-radius:3px;margin:3px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}#stages{display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:stretch}.stg{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:190px;flex:1}.stg b{font-size:13px}.stg .n{font-size:20px;font-weight:700}.stg.z{opacity:.55}.stg .small{display:block}.cc{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:5px 0}.cc.use{border-color:var(--ok);background:#16261f}.ct{font-size:13px;margin-top:3px}.sub{background:var(--pn2);border-radius:8px;padding:8px;font-size:15px}button.on{background:var(--bad);border-color:var(--bad);color:#fff}.job{padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px}.job:hover,.job.on{background:var(--pn2)}.small{color:var(--mu);font-size:12px}.score{font-variant-numeric:tabular-nums}
@media(max-width:900px){main{grid-template-columns:1fr}#side{display:none}}
</style></head><body>
<header><h1>🎙 VoiceStudio</h1>
<input id="q" placeholder="поиск" style="width:200px"><select id="qin" title="Где искать"><option value="all">везде</option><option value="name">имя файла</option><option value="text">перевод</option><option value="sub">субтитры</option></select><select id="ftime" title="Сортировка по времени генерации и слежение за новыми"><option value="">порядок по имени</option><option value="top" selected>⏱ новые сверху</option><option value="bottom">⏱ новые снизу</option></select><select id="flt"><option value="all">все</option><option value="none">без озвучки</option><option value="dub">дубль другого автора</option><option value="bad">плохие (score&gt;0.5)</option><option value="flagbad">👎 помечены плохими</option><option value="suspect">⚠ на проверку (странные)</option><option value="regen">🔁 на перегенерацию</option><option value="unscored">без оценки</option><option value="inst">установлены</option></select>
<span class="small" id="cnt"></span><span style="flex:1"></span>
<label style="margin:0">дублей <input id="ntk" type="number" min="1" max="8" value="1" style="width:50px"></label>
<span class="flex" style="gap:4px" title="Только для генерации (не для расшифровки образцов и оценки): сколько копий модели генерируют одновременно. Авто — добавляет поток, пока GPU недогружен и хватает памяти"><span class="small">потоки</span><select id="thrm"><option value="auto">авто</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><span id="thrt" class="small"></span></span><span class="flex" style="gap:4px" title="Как модель озвучивает реплики. Обычный — по одной (эталон качества). Пакет — несколько реплик за один проход модели: GPU занят плотнее, быстрее на реплику; seed общий на пакет. Быстрый — те же веса Qwen3-TTS, но через CUDA graphs (faster-qwen3-tts), в разы меньше накладных расходов; звук не побитово тот же, но та же модель. Быстрый пакет — оба приёма. Смена режима перезапускает потоки идущей генерации, готовое сохраняется"><span class="small">режим</span><select id="engm"><option value="hf">обычный</option><option value="batch">пакет</option><option value="fast">быстрый</option><option value="fastbatch">быстрый пакет</option></select><select id="bsz" title="Реплик в пакете"><option>4</option><option>8</option><option>16</option></select></span><span id="ainst" class="flex" style="gap:4px"></span><button id="restart" title="Перезапустить сервер: все проходы останавливаются, модели выгружаются">🔄 Перезапуск</button><button class="pri" id="bgen">▶ Генерировать выбранные</button><button id="bscore">📊 Оценить</button><button id="binst">⬇ Установить в игру</button><span class="small" id="ovr"></span><button id="bsus" class="sm" title="Услышали странную реплику: реплики, которые игра играла последние 5 минут, уйдут на проверку (лог suspect.log). Горячая клавиша F8 на странице; в игре — Ctrl+Alt+F9 (скрипт suspect_hotkey.ps1)">⚠ Странно (5 мин) · F8</button> <button id="bpall">⏸ Пауза всё</button><button id="brall">▶ Продолжить всё</button><button id="bmiss">🌙 Фоном: все без озвучки</button><button id="bbad">👎 Плохие</button><button id="breg">🔁 На перегенерацию</button><button id="bdub">↔ Заменить дублем</button><button class="pri" id="bregen">⚙ Перегенерировать помеченные</button><button id="bsel">выбрать видимые</button></header>
<div id="stages"></div>
<main><div id="list"></div><div id="side"></div></main>
<div id="con"><div id="jobs"></div><pre id="log"></pre></div>
<script>
let S=null,sel=new Set(),cur=decodeURIComponent(location.hash.slice(1))||null,jobSel=null,audio=null;const $=id=>document.getElementById(id);
const api=(p,b)=>fetch(p,b===undefined?{}:{method:"POST",body:JSON.stringify(b)}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function play(u){if(audio)audio.pause();audio=new Audio(u);audio.play()}
const best=l=>{const t=l.takes.filter(t=>t.score!=null);return t.length?Math.min(...t.map(t=>t.score)):null};
const tsOf=t=>{if(t.ts)return t.ts;if(t.mt)return t.mt;const m=/^(\d\d)(\d\d)(\d\d)_/.exec(t.take||"");if(!m)return 0;const d=new Date();d.setHours(+m[1],+m[2],+m[3],0);return d/1000};
function lastT(l){const ts=Math.max(0,...(l.takes||[]).map(tsOf));if(!ts)return"";const d=new Date(ts*1000),p=x=>String(x).padStart(2,"0");return `<span class="b" title="время последней генерации">🕒 ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}</span>`}
function status(l){const c=l.chosen;if(!c)return['no','нет'];if(c=="dub")return['dub','дубль другого автора'];const t=l.takes.find(t=>t.take==c);const s=t&&t.score;return s==null?['in','TTS, не оценено']:s>0.5?['bad','TTS плохо '+s.toFixed(2)]:['ok','TTS '+s.toFixed(2)]}
function visible(){return S.lines}
const myTake=l=>{const c=l.takes.find(t=>t.take==l.chosen);if(c)return c;const sc=l.takes.filter(t=>t.score!=null);return sc.length?sc.reduce((a,b)=>b.score<a.score?b:a):l.takes[l.takes.length-1]};
const origLang=l=>l.has.includes("ja")?"ja":l.has[0];
const urlOrig=l=>origLang(l)?`/audio/orig/${origLang(l)}/${l.name}`:null,urlMine=l=>{const t=myTake(l);return t?`/audio/take/${l.name}/${t.take}.wav`:null},urlDub=l=>l.has_dub?`/audio/dub/${l.name}`:null;
let seq=[];function playSeq(us){seq=us.filter(Boolean);const n=()=>{const u=seq.shift();if(!u)return;if(audio)audio.pause();audio=new Audio(u);audio.onended=()=>setTimeout(n,350);audio.play()};n()}
const setFlag=async(names,f)=>{await api("/api/bulk",{names,flag:f});await load()};
const toDub=async names=>{const r=await api("/api/bulk",{names,chosen:"dub"});await load()};
function cmpCard(l){const t=myTake(l),ol=origLang(l),st=l.chosen=="dub"?"dub":l.chosen&&l.chosen!="dub"?"mine":"";
 const col=(cls,title,url,txt,meta,btn)=>`<div class="cc ${cls}"><div class="flex"><b>${title}</b>${btn||''}</div><div class="flex"><button class="sm" ${url?`data-p="${url.slice(7)}"`:'disabled'}>▶</button><span class="small">${meta}</span></div><div class="ct">${txt?esc(txt):'<i class="small">'+(url?'нет расшифровки':'нет')+'</i>'}</div></div>`;
 return `<h3>Сравнение</h3><div class="sub">${esc(l.text)||'<i class="small">нет субтитра</i>'}<div class="small">субтитр игры (русский)</div></div>
 <div class="flex" style="margin:6px 0"><button class="pri" id="cplay">▶ Все по очереди (оригинал → моя → другого)</button></div>
 ${col('',"Оригинал"+(ol?" ("+ol+")":""),urlOrig(l),ol?l.src_text[ol]:'',"Whisper "+(ol||''),'')}
 ${col(st=="mine"?"use":"","Моя (Qwen)"+(st=="mine"?" · в игре":""),urlMine(l),t?(t.heard??''):'',t?(t.score!=null?`score ${t.score} · WER ${t.wer} · тембр ${t.cos??'—'}${t.hallucination?' · ⚠':''}`:'не оценена'):'ещё не генерировалась',t&&l.chosen!=t.take?`<button class="sm" id="cmine">использовать</button>`:'')}
 ${col(st=="dub"?"use":"","Другого автора (мод)"+(st=="dub"?" · в игре":""),urlDub(l),l.dub_text,"Whisper ru",l.has_dub&&st!="dub"?`<button class="sm" id="cdub">заменить на неё</button>`:'')}
 <div class="flex" style="margin-top:8px"><button id="cbad" class="${l.flag=='bad'?'on':''}">👎 ${l.flag=='bad'?'снять «плохая»':'плохая'}</button><button id="creg" class="${l.flag=='regen'?'on':''}">🔁 ${l.flag=='regen'?'снять':'на перегенерацию'}</button></div>
 <div class="small" style="margin-top:4px">Клавиши: ↑↓ реплика · 1 оригинал · 2 моя · 3 другого · 0 все · B плохая · R перегенерация · D заменить дублем</div>`}
function render(){const v=visible();$("cnt").textContent=`показано ${v.length} из ${S.matched} (всего ${S.total}), выбрано ${sel.size}`;
 const L=$("list"),atTop=L.scrollTop<=4,atEnd=L.scrollHeight>L.clientHeight&&L.scrollTop+L.clientHeight>=L.scrollHeight-40,lt=L.getBoundingClientRect().top;
 let anc=null,off0=0;if(!atEnd&&!atTop)for(const r of L.children){const b=r.getBoundingClientRect();if(b.bottom>lt){anc=r.dataset.n;off0=b.top-lt;break}}
 setH(L,v.map(l=>{const [c,t]=status(l);return `<div class="row ${sel.has(l.name)?'sel':''} ${cur==l.name?'cur':''}" data-n="${esc(l.name)}"><input type="checkbox" ${sel.has(l.name)?'checked':''} data-c="${esc(l.name)}">
 <div><div class="nm">${esc(l.name)}</div><div class="tx">${esc(l.text)||'<i class="small">нет текста</i>'}${l.edited?' <span class="b in">правка</span>':''}</div><div class="src">${Object.entries(l.src_text).filter(([k,x])=>x).map(([k,x])=>'ориг '+k+': '+esc(x)).join(' · ')}${l.dub_text?' · др.автор: '+esc(l.dub_text):''}${myTake(l)?.heard?' · моя слышно: '+esc(myTake(l).heard):''}</div></div>
 <div><span class="b ${c}">${t}</span>${lastT(l)}${l.flag=='bad'?'<span class="b bad">👎 плохая</span>':l.flag=='regen'?'<span class="b dub">🔁 перегенерировать</span>':''}${l.installed?'<span class="b in">в игре</span>':''}<div class="flex" style="margin-top:4px">${urlOrig(l)?`<button class="sm" title="оригинал" data-p="${urlOrig(l).slice(7)}">▶ ориг</button>`:''}${urlMine(l)?`<button class="sm" title="моя" data-p="${urlMine(l).slice(7)}">▶ моя</button>`:''}${l.has_dub?`<button class="sm" title="другого автора" data-p="${urlDub(l).slice(7)}">▶ др.</button>`:''}</div><div class="flex" style="margin-top:3px"><button class="sm" data-f="bad:${esc(l.name)}">👎</button><button class="sm" data-f="regen:${esc(l.name)}">🔁</button>${l.has_dub?`<button class="sm" data-f="dub:${esc(l.name)}">↔дубль</button>`:''}</div></div></div>`}).join(''));
 if(atTop)L.scrollTop=0;else if(atEnd)L.scrollTop=L.scrollHeight;else if(anc){const r=[...L.children].find(x=>x.dataset.n==anc);if(r)L.scrollTop+=r.getBoundingClientRect().top-lt-off0}
 renderThr();renderSide();renderJobs();renderStages();renderAinst()}
$("list").onclick=e=>{const c=e.target.dataset.c,p=e.target.dataset.p,f=e.target.dataset.f;if(f){const[k,n]=f.split(/:(.*)/s);const L=S.lines.find(x=>x.name==n);if(k=="dub")toDub([n]);else setFlag([n],L.flag==k?null:k);return}if(p){play("/audio/"+p);return}if(c){sel.has(c)?sel.delete(c):sel.add(c);render();return}const r=e.target.closest(".row");if(r){cur=r.dataset.n;render()}};
function modelOpts(id){return S.models.map(m=>`<option value="${m.id}" ${m.id==id?'selected':''}>${esc(m.name)}</option>`).join('')}
function refForm(ref,pre){const src=ref.src||"lang";return `<label>Откуда берём голос (образец)</label><select id="${pre}src"><option value="lang" ${src=='lang'?'selected':''}>оригинал игры — язык</option><option value="any" ${src=='any'?'selected':''}>любой язык оригинала (первый, где есть запись)</option><option value="dub" ${src=='dub'?'selected':''}>русская озвучка другого автора</option><option value="sample" ${src=='sample'?'selected':''}>свой образец (wav)</option></select>
 <div id="${pre}any" ${src!='any'?'hidden':''}><label>Порядок языков (пусто = все по алфавиту), например: ja en de</label><input id="${pre}ord" value="${esc(ref.order||'')}"></div><div id="${pre}lang" ${src!='lang'?'hidden':''}><label>Язык оригинала</label><select id="${pre}l">${S.langs.map(k=>`<option ${k==(ref.lang||'ja')?'selected':''}>${k}</option>`).join('')}</select><label>Реплики-образцы (имена через пробел; пусто = эта же реплика; несколько = склейка до 20 с)</label><input id="${pre}lines" value="${esc((ref.lines||[]).join(' '))}"></div>
 <div id="${pre}smp" ${src!='sample'?'hidden':''}><label>Файл</label><select id="${pre}file"><option value="">—</option>${Object.keys(S.samples).map(k=>`<option ${k==ref.file?'selected':''}>${esc(k)}</option>`).join('')}</select> <input type="file" id="${pre}up" accept="audio/wav,.wav" style="margin-top:4px"><label>Расшифровка образца (пусто — Whisper)</label><input id="${pre}stext" value="${esc(S.samples[ref.file]?.text||'')}"></div>`}
function refRead(pre){const s=$(pre+"src").value;if(s=="dub")return{src:"dub"};if(s=="any")return{src:"any",order:$(pre+"ord").value.trim()};if(s=="sample")return{src:"sample",file:$(pre+"file").value};const ls=$(pre+"lines").value.trim().split(/\s+/).filter(Boolean);return{src:"lang",lang:$(pre+"l").value,lines:ls}}
function bindRef(pre){$(pre+"src").onchange=()=>{const v=$(pre+"src").value;$(pre+"lang").hidden=v!="lang";$(pre+"any").hidden=v!="any";$(pre+"smp").hidden=v!="sample"};const u=$(pre+"up");if(u)u.onchange=async()=>{const f=u.files[0];if(!f)return;await fetch("/api/upload?name="+encodeURIComponent(f.name),{method:"POST",body:await f.arrayBuffer()});await load();$(pre+"src").value="sample";$(pre+"src").onchange();$(pre+"file").value=f.name.replace(/[^\w.\-]/g,"_")}}
let PPV={},PADP="";
function setH(el,h){if(el.__h===h)return false;el.__h=h;el.innerHTML=h;return true}
function renderSide(){const el=$("side");if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#side")&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!window.__force)return;window.__force=0;const l=S.lines.find(x=>x.name==cur);
 let h=`<h3>⓪ Подготовка проекта</h3>`+prepForm()+(l?cmpCard(l):'<div class="small">Выберите реплику слева — появится сравнение оригинала, моей версии и версии другого автора.</div>')+`<h3>Умолчания проекта</h3><label>Модель</label><select id="dm">${modelOpts(S.defaults.model)}</select><div class="small" id="dmnote">${esc(S.models.find(m=>m.id==S.defaults.model)?.note||'')}</div>${refForm(S.defaults.ref,"d")}<div class="flex" style="margin-top:8px"><button id="dsave">Сохранить умолчания</button></div>`;
 if(l){const c=l.cfg;h+=`<h3>Реплика</h3><div class="nm">${esc(l.name)}</div><label>Русский текст (правка → генерировать заново)</label><textarea id="ltext">${esc(l.text)}</textarea>
 <div class="flex"><button class="sm" id="ltsave">сохранить текст</button><button class="sm" id="ltreset">вернуть исходный</button></div>
 <h3>Свои настройки реплики ${Object.keys(l.own).length?'<span class="b in">заданы</span>':''}</h3><label>Модель</label><select id="lm">${modelOpts(c.model)}</select>${refForm(c.ref,"l")}
 <label>Параметры (JSON, поверх умолчаний модели)</label><textarea id="lpar">${esc(JSON.stringify(l.own.params||{}))}</textarea>
 <div class="flex" style="margin-top:6px"><button id="lsave">Применить к реплике</button><button id="lall">…и ко всем выбранным</button><button id="lclr">Сбросить</button></div>
 <div class="flex" style="margin-top:8px"><button class="pri" id="lgen">▶ Сгенерировать</button><button id="lchd" ${l.has_dub?'':'disabled'}>Взять дубль другого автора</button></div>
 <h3>Дубли (${l.takes.length})</h3>`+l.takes.slice().reverse().map(t=>`<div class="take ${l.chosen==t.take?'ch':''}"><div class="flex"><b>${esc(t.model)}</b><span class="small">${esc(t.ref)} · ${t.dur}с</span></div>
